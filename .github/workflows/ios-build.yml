name: Validar iOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-flutter:
    name: Analizar y probar Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

  build-ios:
    name: Compilar aplicación 1.7.0 para iPhone
    needs: validate-flutter
    # MLImage de ML Kit se distribuye para iPhone y no para el simulador.
    # La compilación sin firma valida el paquete real sin exigir una cuenta Apple.
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar aplicación iOS sin firma
        run: |
          flutter build ios --debug --no-codesign \
            --dart-define=CLOUDINARY_CLOUD_NAME=ci_demo \
            --dart-define=CLOUDINARY_UNSIGNED_UPLOAD_PRESET=ci_demo_unsigned

      - name: Verificar paquete para iPhone
        shell: bash
        run: |
          test -d build/ios/iphoneos/Runner.app
          test -f build/ios/iphoneos/Runner.app/Runner
          file build/ios/iphoneos/Runner.app/Runner
          plutil -p build/ios/iphoneos/Runner.app/Info.plist

      - name: Guardar aplicación iOS sin firma
        uses: actions/upload-artifact@v4
        with:
          name: asistencia-hospitalaria-1.7.0-ios-iphone-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
